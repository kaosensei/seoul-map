<style>.leaflet-cluster-anim .leaflet-marker-icon, .leaflet-cluster-anim .leaflet-marker-shadow {
	-webkit-transition: -webkit-transform 0.3s ease-out, opacity 0.3s ease-in;
	-moz-transition: -moz-transform 0.3s ease-out, opacity 0.3s ease-in;
	-o-transition: -o-transform 0.3s ease-out, opacity 0.3s ease-in;
	transition: transform 0.3s ease-out, opacity 0.3s ease-in;
}

.leaflet-cluster-spider-leg {
	/* stroke-dashoffset (duration and function) should match with leaflet-marker-icon transform in order to track it exactly */
	-webkit-transition: -webkit-stroke-dashoffset 0.3s ease-out, -webkit-stroke-opacity 0.3s ease-in;
	-moz-transition: -moz-stroke-dashoffset 0.3s ease-out, -moz-stroke-opacity 0.3s ease-in;
	-o-transition: -o-stroke-dashoffset 0.3s ease-out, -o-stroke-opacity 0.3s ease-in;
	transition: stroke-dashoffset 0.3s ease-out, stroke-opacity 0.3s ease-in;
}

<style>
/* Layout: 測量圖風格的 app——左側面板（路線卡＋與地圖同步的地點清單）＋右側自繪底圖（OSM 向量，無圖磚）；地圖上方是區域快速跳轉列 */
:root {
  --bg: #F3F5F4; --panel: #FFFFFF; --ink: #17212B; --muted: #5B6873; --line: #D9DFE2;
  --land: #E9EDEA; --water: #B9D3E1; --water-edge: #9DBFD2; --peak: #6E7B74; --area: #3F4B55; --accent: #D9481C;
  --chip-off: #EEF1F0; --sel: #17212B; --shadow: 0 1px 2px rgba(23,33,43,.08), 0 4px 16px rgba(23,33,43,.08);
  --f-num: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171C; --panel: #172027; --ink: #E4EAEE; --muted: #93A1AB; --line: #2A353E;
  --land: #1A2228; --water: #1F3A4C; --water-edge: #2B4C61; --peak: #8C9A93; --area: #C4CED5; --accent: #F06A3C;
  --chip-off: #212C34; --sel: #FFFFFF; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171C; --panel: #172027; --ink: #E4EAEE; --muted: #93A1AB; --line: #2A353E;
  --land: #1A2228; --water: #1F3A4C; --water-edge: #2B4C61; --peak: #8C9A93; --area: #C4CED5; --accent: #F06A3C;
  --chip-off: #212C34; --sel: #FFFFFF; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.app { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; height: 100%; min-height: 560px; }
.panel { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; min-width: 0; }
.panel-inner { display: flex; flex-direction: column; gap: 20px; padding-inline: 18px; padding-block: 18px 28px; }
.mapwrap { position: relative; min-width: 0; height: 100%; }
#map { position: absolute; inset: 0; background: var(--land); }
.leaflet-container { background: var(--land); font-family: var(--f-body); }

header h1 { margin: 0; font-size: 22px; letter-spacing: .02em; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
.sect-h h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--muted); }
.sect-h span { font-family: var(--f-num); color: var(--muted); font-size: 14px; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 標頭：外觀切換＋檢視切換 */
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.theme-btn { border: 1px solid var(--line); background: var(--chip-off); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.seg { display: inline-flex; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); color: var(--muted); padding: 5px 14px; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--panel); }

/* 清單總覽（蓋在地圖區上） */
.overview { position: absolute; inset: 0; z-index: 1100; background: var(--bg); overflow-y: auto; padding: 16px 20px 40px; }
.overview[hidden] { display: none; }
.ov-bar { position: sticky; top: -16px; z-index: 2; background: var(--bg); display: flex; justify-content: space-between; align-items: center; gap: 12px;
  flex-wrap: wrap; padding: 6px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.ov-bar b { font-family: var(--f-num); font-size: 18px; margin-right: 8px; }
.ov-hint { color: var(--muted); font-size: 12px; }
.ov-bar select { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.ov-h { margin: 18px 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.ov-h i { width: 10px; height: 10px; border-radius: 50%; background: var(--cc, var(--muted)); }
.ov-h span { font-family: var(--f-num); color: var(--muted); font-weight: 500; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--cc); border-radius: 8px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 4px; min-width: 0; }
body.listview .listbar .toggle { display: none; }
.card.sel { box-shadow: 0 0 0 2px var(--cc); }
.card.flash { animation: cardflash 1.2s ease-out; }
@keyframes cardflash { 0% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--cc) 45%, transparent); } 100% { box-shadow: 0 0 0 2px var(--cc); } }
.card.dead { opacity: .55; border-left-color: #9a9a9a; }
.card-top { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.card h3 { margin: 0; font-size: 15px; }
.card .ko { color: var(--muted); font-size: 12px; }
.card .tags { display: flex; gap: 4px; flex-wrap: wrap; font-size: 11px; }
.card .tags span { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.card .tags .t { color: var(--cc); border-color: var(--cc); }
.card .tags .st { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.card p { margin: 2px 0; font-size: 13px; }
.card .sch { font-size: 12px; background: var(--chip-off); border-radius: 4px; padding: 3px 6px; }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 4px; }
.card .foot button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; white-space: nowrap; }

/* 區域跳轉列（浮在地圖上） */
.areas { position: absolute; z-index: 800; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none; padding-bottom: 2px; }
.areas::-webkit-scrollbar { display: none; }
.areas button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap; }
.areas button:hover { border-color: var(--muted); }
.areas button.home { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.leaflet-top.leaflet-left { top: 48px; }

/* 路線卡 */
.routes { display: flex; flex-direction: column; gap: 8px; }
.route { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); text-align: left; color: var(--ink);
  padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.route:hover { border-color: var(--muted); }
.route[aria-expanded="true"] { border-color: var(--rc); box-shadow: inset 3px 0 0 var(--rc); }
.route-top { display: flex; align-items: center; gap: 8px; }
.swatch { width: 18px; height: 4px; border-radius: 2px; background: var(--rc); flex: none; }
.route-name { font-weight: 600; flex: 1; min-width: 0; }
.kind { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.stats { display: flex; gap: 14px; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.stats b { font-size: 20px; font-weight: 600; }
.stats small { font-size: 12px; color: var(--muted); margin-left: 2px; letter-spacing: .04em; }
.route-detail { display: flex; flex-direction: column; gap: 8px; }
.route-detail p { margin: 0; color: var(--muted); font-size: 13px; }
.route-detail ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 12px; columns: 2; column-gap: 16px; }
.profile { width: 100%; height: auto; display: block; }
.profile text { font-family: var(--f-num); font-size: 10px; fill: var(--muted); }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

/* 篩選 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--chip-off);
  color: var(--muted); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 13px; cursor: pointer; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--cc); opacity: .3; }
.chip[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--cc); }
.chip[aria-pressed="true"] i { opacity: 1; }
.chip span { font-family: var(--f-num); font-size: 13px; color: var(--muted); }
.chip-tools { display: flex; gap: 12px; margin-top: 8px; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; cursor: pointer; font-size: 13px; }
#q { width: 100%; margin-top: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 6px; padding: 8px 10px; font: inherit; box-sizing: border-box; }
.listbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.list { display: flex; flex-direction: column; margin-top: 6px; }
.group-h { font-size: 12px; color: var(--muted); padding: 10px 2px 4px; display: flex; align-items: center; gap: 6px; }
.group-h i { width: 8px; height: 8px; border-radius: 50%; background: var(--cc); }
.item { display: grid; grid-template-columns: 10px 1fr; gap: 0 10px; text-align: left; border: 0; border-top: 1px solid var(--line);
  background: transparent; color: var(--ink); padding: 8px 6px; cursor: pointer; border-radius: 4px; }
.item:hover { background: var(--bg); }
.item.active { background: var(--bg); box-shadow: inset 3px 0 0 var(--cc); }

86,"lng":126.91771,"approx":false,"via":"","url":"","note_by":"Claude"},{"id":"c05","name":"Hermit 허밋","name_ko":"허밋","type":"Live","area":"弘大・合井・延南","status":"候選","rec":["曹"],"quote":[{"by":"曹","text":"18:40 - 04:00｜Hermit 허밋｜合井公演場兼酒吧，每天都有表演"}],"note":"","note_src":"","closed":[],"window":"","booking":"","hours_note":"18:40–04:00","address":"서울 마포구 양화로6길 27","lat":37.54917,"lng":126.91568,"approx":false,"via":"","url":"","note_by":"Claude"},{"id":"y02","name":"戰爭與女性人權博物館","name_ko":"전쟁과여성인권박물관","type":"歷史館","area":"弘大・合井・延南","status":"候選","rec":["又姐","曹"],"quote":[{"by":"又姐","text":"通常大家去首爾會去「戰爭紀念館」（主要關注韓戰但也有其他的），這個關注的是戰爭性犯罪受害者，以韓國的脈絡來說就是二戰時期的日軍慰安婦。\n搭配收聽 情熱韓半島 EP03：失去青春、人生和正義的《最後一個人》｜金息"},{"by":"曹","text":"10:00 - 17:00｜戰爭與女性人權博物館 전쟁과여성인권박물관"},{"by":"曹","text":"突然想到，去韓國有時間的話超級推薦去反戰博物館 +DMZ 一日遊參訪"}],"note":"【查證】官網 403 讀不到；搜尋摘要寫週二–六 10–18、週日一休，現場有英文語音導覽。沒查到遷址或閉館報導，出發前打 02-392-5252。","note_src":"","closed":["日","一"],"window":"","booking":"不用","hours_note":"10–18（官網讀不到，打 02-392-5252 確認）","address":"","lat":37.5601,"lng":126.91488,"approx":false,"via":"Google Doc＋Heptabase 卡","url":"https://naver.me/FW6G3vj5","note_by":"Claude"},{"id":"y04","name":"新聞博物館 Presseum＋一民美術館","name_ko":"신문박물관","type":"歷史館","area":"鐘路・北村","status":"候選","rec":["又姐"],"quote":[{"by":"又姐","text":"報紙博物館 Presseum（신문박물관）：就在教保對面，原《東亞日報》總部，1-4樓為一民美術館，5樓開始作為報紙博物館使用。可以看到獨立運動、韓戰、軍事獨裁時期、民主化運動的報紙變化，有韓國重大歷史事件頭版集成，與印刷、報紙廣告、諷刺漫畫、新聞攝影等不同部門的呈現。有一口窗戶正對光化門廣場、景福宮與北嶽山，視角絕佳。"}],"note":"1–4 樓是一民美術館（展覽另收費），5 樓起是新聞博物館。新聞博物館位於東亞媒體中心大樓（5號線光化門站5號出口旁），採售票入場，售票到 18:00 截止，週一與元旦、春節、中秋休館；團體參觀須預約。一民美術館 11:00–19:00，週一休（第三方網站 2025/11 資料），兩邊休館日都落在週一。","note_src":"https://world.nol.com/en/content/pois/6f482520-7dd4-474d-9f73-1b51adb69887","closed":["一"],"window":"","booking":"不用","hours_note":"10–18:30，₩4,000","address":"서울 종로구 세종대로 152","lat":37.56985,"lng":126.97761,"approx":false,"via":"Google Doc＋Heptabase 卡","url":"","note_by":"Claude"},{"id":"y05","name":"京橋莊","name_ko":"경교장","type":"歷史館","area":"西村・景福宮","status":"候選","rec":["又姐"],"quote":[{"by":"又姐","text":"京橋莊（경교장）：韓國獨立運動重要人物金九生前最後辦公與居住的地點，二樓爲其遭到暗殺的事件現場，有留下當時的彈孔。地點偏謎，夾在一些醫院中間。IG上有人有介紹。"}],"note":"在江北三星醫院院區內，首爾歷史博物館分館。；京橋莊是首爾歷史博物館的分館，免費參觀，入口在江北三星醫院院區內。館內重現大韓民國臨時政府時期的辦公室，地下樓層有常設展；現場沒有停車場。","note_src":"https://news.seoul.go.kr/culture/archives/tag/%ea%b2%bd%ea%b5%90%ec%9e%a5","closed":["一"],"window":"","booking":"不用","hours_note":"09–18，免費","address":"서울 종로구 새문안로 29","lat":37.56819,"lng":126.9679,"approx":false,"via":"Google Doc＋Heptabase 卡","url":"","note_by":"Claude"},{"id":"y06","name":"白麟濟家屋","name_ko":"백인제가옥","type":"歷史館","area":"鐘路・北村","status":"候選","rec":["又姐"],"quote":[{"by":"又姐","text":"白麟濟故居 백인제가옥：已大致落在北村韓屋村區域，但這邊人不會那麼多。金泰梨主演韓劇《正年》拍攝場景。（BTW從這裡往地鐵安國站的方向走會經過憲法裁判所）"}],"note":"庭院可自由參觀；室內只開放給導覽參加者（約 30 分鐘，平日 4 梯、週末 6 梯，在 yeyak.seoul.go.kr 預約）。預約網站支援 Naver／Kakao 簡易登入，2024 年報導提到另有外國人專用導覽；外國人能否在網站完成預約仍未確認，可現場詢問或打 02-724-0200。錯過導覽可用語音導覽。","note_src":"https://mediahub.seoul.go.kr/archives/2010322","closed":["一"],"window":"","booking":"建議","hours_note":"9–18 免費；室內要預約導覽 yeyak.seoul.go.kr","address":"서울 종로구 북촌로7길 16","lat":37.5807,"lng":126.98417,"approx":false,"via":"Google Doc＋Heptabase 卡","url":"","note_by":"Claude"},{"id":"y07","name":"世宗文化會館 Backstage Tour","name_ko":"세종문화회관","type":"導覽","area":"西村・景福宮","status":"候選","rec":["又姐"],"quote":[{"by":"又姐","text":"這個是一個表演場地（感覺不算是國家戲劇院但規模也夠大了，在光化門廣場那裡），我在那邊看過兩次音樂劇，這個後台導覽我超想去；韓國的國會議事堂跟憲法裁判所也有導覽行程，但要先預約，有興趣可以研究一下"}],"note":"2026/5 起開放外國人，行程含舞台、後台、排練室、屋頂展望台，約 70 分鐘；每梯 25 人。","note_src":"","closed":[],"window":"","booking":"必要","hours_note":"英語場週四 10:00（10/29、11/5），₩35,000，12 月前 7 折","address":"서울 종로구 세종대로 175","lat":37.5725,"lng":126.9757,"approx":false,"via":"Google Doc＋Heptabase 卡","url":"","note_by":"Claude"},{"id":"y08","name":"國會議事堂 參觀","name_ko":"국회의사당","type":"導覽","area":"汝矣島","status":"候選","rec":["又姐"],"quote":[{"by":"又姐","text":"這個是一個表演場地（感覺不算是國家戲劇院但規模也夠大了，在光化門廣場那裡），我在那邊看過兩次音樂劇，這個後台導覽我超想去；韓國的國會議事堂跟憲法裁判所也有導覽行程，但要先預約，有興趣可以研究一下"}],"note":"國會線上預約（reservation.assembly.go.kr），90 天內到前一天，平日 10–1 function profileSVG(r) {
  const W = 340, H = 110, pl = 30, pr = 6, pt = 8, pb = 18;
  const xs = r.path.map(p => p[3]), es = r.path.map(p => p[2]);
  const maxX = xs[xs.length - 1] || 1, minE = Math.min(...es), maxE = Math.max(...es);
  const lo = Math.floor(minE / 100) * 100, hi = Math.max(lo + 100, Math.ceil(maxE / 100) * 100);
  const X = x => pl + (x / maxX) * (W - pl - pr), Y = e => pt + (1 - (e - lo) / (hi - lo)) * (H - pt - pb);
  const d = r.path.map((p, i) => `${i ? 'L' : 'M'}${X(p[3]).toFixed(1)},${Y(p[2]).toFixed(1)}`).join('');
  const area = `${d}L${X(maxX).toFixed(1)},${Y(lo)}L${X(0)},${Y(lo)}Z`;
  const step = maxX > 15 ? 5 : maxX > 6 ? 2 : 1;
  let ticks = '';
  for (let k = 0; k <= maxX + 0.01; k += step) ticks += `<text x="${X(k)}" y="${H - 4}" text-anchor="middle">${k}</text>`;
  const grid = [lo, (lo + hi) / 2, hi].map(e => `<line x1="${pl}" x2="${W - pr}" y1="${Y(e)}" y2="${Y(e)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 4}" y="${Y(e) + 3}" text-anchor="end">${Math.round(e)}</text>`).join('');
  const wps = r.waypoints.map((w, i) => {
    let best = 0, bd = 1e9;
    r.path.forEach((p, j) => { const dd = (p[0] - w.lat) ** 2 + (p[1] - w.lng) ** 2; if (dd < bd) { bd = dd; best = j; } });
    const p = r.path[best];
    return `<g><title>${i + 1}. ${esc(w.name)}</title><circle cx="${X(p[3])}" cy="${Y(p[2])}" r="4" fill="${r.color}" stroke="var(--panel)" stroke-width="1.5"/><text x="${X(p[3])}" y="${Y(p[2]) - 7}" text-anchor="middle">${i + 1}</text></g>`;
  }).join('');
  return `<svg class="profile" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(r.name)} 海拔剖面，${lo} 到 ${hi} 公尺">
    ${grid}<path d="${area}" fill="${r.color}" fill-opacity=".16"/><path d="${d}" fill="none" stroke="${r.color}" stroke-width="1.6"/>${wps}${ticks}</svg>`;
}

const byId = Object.fromEntries(markers.map(x => [x.p.id, x]));
function select(id, fromList) {
  if (selected && byId[selected]) { const o = byId[selected]; o.m.setIcon(L.divIcon({ className: '', html: dotHTML(o.p, false), iconSize: [26, 26], iconAnchor: [13, 13] })); }
  selected = id;
  document.querySelectorAll('.item.active').forEach(e => e.classList.remove('active'));
  if (!id) return;
  const { m, p } = byId[id];
  m.setIcon(L.divIcon({ className: '', html: dotHTML(p, true), iconSize: [26, 26], iconAnchor: [13, 13] }));
  const li = document.getElementById('it-' + id);
  if (li) { li.classList.add('active'); if (!fromList && !isNarrow()) li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  if (fromList) cluster.zoomToShowLayer(m, () => m.openPopup());
}

const on = new Set(CATS.map(c => c[0]));
const chipsEl = document.getElementById('chips'), listEl = document.getElementById('list'), qEl = document.getElementById('q'), inViewEl = document.getElementById('inView');
const chipBtns = {};
CATS.forEach(([k, t, c]) => {
  const n = PLACES.filter(p => p.cat === k).length; if (!n) return;
  const b = document.createElement('button');
  b.className = 'chip'; b.style.setProperty('--cc', c); b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `<i></i>${t}<span>${n}</span>`;
  b.addEventListener('click', () => { on.has(k) ? on.delete(k) : on.add(k); b.setAttribute('aria-pressed', on.has(k)); refresh(); });
  chipsEl.appendChild(b); chipBtns[k] = b;
});
// 歇業預設隱藏，點「歇業」chip 才顯示
const recOn = new Set(RECS), stOn = new Set(STATUSES.filter(s => s !== '歇業'));
function subChips(elId, keys, set, field) {
  const el = document.getElementById(elId);
  keys.forEach(k => {
    const n = PLACES.filter(p => field === 'rec' ? p.rec.includes(k) : p[field] === k).length; if (!n) return;
    const b = document.createElement('button'); b.className = 'chip plain'; b.setAttribute('aria-pressed', set.has(k));
    b.innerHTML = `${k}<span>${n}</span>`;
    b.addEventListener('click', () => { set.has(k) ? set.delete(k) : set.add(k); b.setAttribute('aria-pressed', set.has(k)); refresh(); });
    el.appendChild(b);
  });
}
subChips('recChips', RECS, recOn, 'rec');
subChips('stChips', STATUSES, stOn, 'status');
const setAll = v => { CATS.forEach(([k]) => { v ? on.add(k) : on.delete(k); chipBtns[k]?.setAttribute('aria-pressed', v); }); refresh(); };
document.getElementById('allOn').addEventListener('click', () => setAll(true));
document.getElementById('allOff').addEventListener('click', () => setAll(false));
qEl.addEventListener('input', refresh);
inViewEl.addEventListener('change', renderList);
map.on('moveend', renderList);

let visible = [];
function refresh() {   // 篩選改變：重建地圖上的點，再更新清單
  const q = qEl.value.trim().toLowerCase();
  visible = markers.filter(({ p }) => on.has(p.cat) && p.rec.some(r => recOn.has(r)) && stOn.has(p.status)
    && (!q || [p.name, p.name_ko, p.area, p.note, p.quote.map(q => q.text).join(' '), p.via, p.hours_note, p.rec.join(' ')].join(' ').toLowerCase().includes(q)));
  cluster.clearLayers(); cluster.addLayers(visible.map(x => x.m));
  if (q && visible.length && visible.length <= 30) map.flyToBounds(L.latLngBounds(visible.map(x => [x.p.lat, x.p.lng])), { padding: [60, 60], maxZoom: 15, duration: .5 });
  renderList(); renderOverview();
}
function renderList() {
  const b = map.getBounds();
  const rows = inViewEl.checked && view === 'map' ? visible.filter(({ p }) => b.contains([p.lat, p.lng])) : visible;
  document.getElementById('count').textContent = inViewEl.checked && view === 'map' ? `範圍內 ${rows.length}・符合 ${visible.length}` : `${visible.length} / ${PLACES.length}`;
  listEl.innerHTML = '';
  if (!rows.length) {
    listEl.innerHTML = `<div class="empty">${visible.length ? '這個範圍內沒有符合的地點。拖動或縮小地圖，或取消「只列出地圖範圍內」。' : '沒有符合的地點。換個關鍵字，或打開更多類別。'}</div>`;
    return;
  }
  CATS.forEach(([k, t, c]) => {
    const g = rows.filter(x => x.p.cat === k); if (!g.length) return;
    const h = document.createElement('div'); h.className = 'group-h'; h.style.setProperty('--cc', c);
    h.innerHTML = `<i></i>${t}・${g.length}`; listEl.appendChild(h);
    g.forEach(({ p }) => {
      const it = document.createElement('button');
      it.className = 'item' + (p.id === selected ? ' active' : ''); it.id = 'it-' + p.id; it.style.setProperty('--cc', c);
      it.innerHTML = `<i class="${p.approx ? 'approx' : ''}${DEAD.has(p.status) ? ' dead' : ''}"></i><b>${esc(p.name)}</b><small>${p.status !== '候選' ? esc(p.status) + '・' : ''}${esc(p.area)}</small>`;
      it.addEventListener('click', () => {
        if (view === 'list') return focusCard(p.id);
        select(p.id, true); if (isNarrow()) document.querySelector('.mapwrap').scrollIntoView({ behavior: 'smooth' });
      });
      listEl.appendChild(it);
    });
  });
}

// ── 外觀：自動 → 淺色 → 深色（記在這台瀏覽器）
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const THEMES = [['auto', '◐ 自動'], ['light', '☀︎ 淺色'], ['dark', '☾ 深色']];
let theme = store.get('theme') || 'auto';
const themeBtn = document.getElementById('themeBtn');
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
  themeBtn.textContent = THEMES.find(t => t[0] === theme)[1];
}
themeBtn.addEventListener('click', () => { const i = THEMES.findIndex(t => t[0] === theme); theme = THEMES[(i + 1) % 3][0]; store.set('theme', theme); applyTheme(); });
applyTheme();

// ── 清單總覽
const ovEl = document.getElementById('overview'), ovBody = document.getElementById('ovBody'), ovGroup = document.getElementById('ovGroup');
let view = store.get('view') === 'list' ? 'list' : 'map';
ovGroup.value = store.get('ovGroup') || 'area';
const AREA_ORDER = AREAS.map(a => a[0]).concat('外圍');
function cardHTML(p) {
  const sch = schedHTML(p), c = CAT[p.cat].c;
  return `<article class="card${DEAD.has(p.status) ? ' dead' : ''}${p.id === selected ? ' sel' : ''}" id="card-${esc(p.id)}" style="--cc:${c}">
    <div class="card-top"><h3>${esc(p.name)}</h3>${p.name_ko && p.name_ko !== p.name ? `<span class="ko">${esc(p.name_ko)}</span>` : ''}</div>
    <div class="tags"><span class="t">${esc(p.type)}</span><span>${esc(p.area)}</span>${p.status !== '候選' ? `<span class="st">${esc(p.status)}</span>` : ''}${p.approx ? '<span>位置約略</span>' : ''}</div>
    ${quoteHTML(p)}${noteHTML(p)}${sch ? `<p class="sch">${sch}</p>` : ''}
    <div class="foot"><span>推薦：${p.rec.map(esc).join('、')}</span><span><button data-go="${esc(p.id)}">在地圖上看</button>・<a href="${p.url || naver(p.name_ko || p.name)}" target="_blank" rel="noopener" style="color:var(--accent)">Naver ↗</a></span></div>
  </article>`;
}
function renderOverview() {
  if (view !== 'list') return;
  const ps = visible.map(x => x.p), g = ovGroup.value;
  document.getElementById('ovCount').textContent = `${ps.length} 個地點`;
  let keys, pick, color = () => '';
  if (g === 'area') { keys = AREA_ORDER; pick = k => ps.filter(p => p.area === k); }
  else if (g === 'type') { keys = CATS.map(c => c[0]); pick = k => ps.filter(p => p.type === k); color = k => CAT[k].c; }
  else if (g === 'rec') { keys = RECS; pick = k => ps.filter(p => p.rec.includes(k)); }
  else { keys = STATUSES; pick = k => ps.filter(p => p.status === k); }
  const tyIdx = Object.fromEntries(CATS.map((c, i) => [c[0], i]));
  ovBody.innerHTML = keys.map(k => {
    const list = pick(k).sort((a, b) => tyIdx[a.type] - tyIdx[b.type] || a.area.localeCompare(b.area));
    if (!list.length) return '';
    return `<h2 class="ov-h" style="--cc:${color(k)}"><i></i>${esc(k)}<span>${list.length}</span></h2><div class="ov-grid">${list.map(cardHTML).join('')}</div>`;
  }).join('') || '<div class="empty">沒有符合的地點。換個關鍵字，或在左側打開更多篩選。</div>';
}
ovGroup.addEventListener('change', () => { store.set('ovGroup', ovGroup.value); renderOverview(); });
ovBody.addEventListener('click', e => {
  const id = e.target.closest('[data-go]')?.dataset.go; if (!id) return;
  setView('map'); setTimeout(() => select(id, true), 50);
});
// 清單總覽：左側點地點 → 右側捲到那張卡並標出來
function focusCard(id) {
  const el = document.getElementById('card-' + id); if (!el) return;
  document.querySelectorAll('.card.sel').forEach(e => e.classList.remove('sel'));
  document.querySelectorAll('.item.active').forEach(e => e.classList.remove('active'));
  document.getElementById('it-' + id)?.classList.add('active');
  selected = id; el.classList.add('sel', 'flash');
  el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  setTimeout(() => el.classList.remove('flash'), 1200);
}
function setView(v) {
  view = v; store.set('view', v);
  ovEl.hidden = v !== 'list'; document.body.classList.toggle('listview', v === 'list');
  document.getElementById('vMap').setAttribute('aria-selected', v === 'map'); document.getElementById('vList').setAttribute('aria-selected', v === 'list');
  if (v === 'list') { ovEl.scrollTop = 0; renderOverview(); renderList(); if (selected) focusCard(selected); } else { map.invalidateSize(); renderList(); }
}
document.getElementById('vMap').addEventListener('click', () => setView('map'));
document.getElementById('vList').addEventListener('click', () => setView('list'));

document.getElementById('sum').textContent = `${PLACES.length} 個可選地點、${ROUTES.length} 條跑步路線`;
stylizeBase();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', stylizeBase);
new MutationObserver(stylizeBase).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// 頁框載入時地圖容器可能還是 0 高，等它有尺寸再定視野；之後尺寸變動就重算
let homed = false;
new ResizeObserver(() => {
  const el = document.getElementById('map');
  if (!el.clientHeight || !el.clientWidth) return;
  map.invalidateSize();
  if (!homed) { homed = true; map.fitBounds(AREAS[0][2].map((x, i) => i ? [x[0] + .01, x[1] + .02] : [x[0] - .012, x[1] - .03])); }
  layersByZoom(); renderList();
}).observe(document.getElementById('map'));
refresh(); layersByZoom();
if (view === "list") setView("list");
</script>
